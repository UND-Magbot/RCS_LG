<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>로봇 태블릿</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR',sans-serif; background:#1a1a2e; color:#fff;
       display:flex; flex-direction:column; align-items:center; justify-content:center;
       height:100vh; overflow:hidden; }
.status-box { text-align:center; width:90%; max-width:900px;
              display:flex; flex-direction:column; align-items:center; gap:1.5vh; }
.amr-label { font-size:2.5rem; font-size:clamp(2rem,6vw,4rem); font-weight:800; color:#42a5f5;
             letter-spacing:0.05em; }
.poi-name { font-size:clamp(3rem,10vw,7rem); font-weight:800; line-height:1.3;
            color:#e94560; word-break:keep-all; white-space:pre-line; }
.status-text { font-size:clamp(1.6rem,5vw,3rem); line-height:1.4; color:#aaa;
               word-break:keep-all; }
.loop-info { font-size:clamp(1.2rem,3.5vw,2rem); line-height:1.3; color:#666; }

#btn-confirm {
  display:none; width:80vw; max-width:560px; height:clamp(80px,18vh,160px);
  font-size:clamp(2rem,6vw,3.5rem); font-weight:800; border:none; border-radius:24px;
  background:linear-gradient(135deg,#e94560,#c23152); color:#fff;
  cursor:pointer; box-shadow:0 12px 40px rgba(233,69,96,0.5);
  transition:transform .1s,box-shadow .1s;
  justify-content:center; align-items:center;
  margin-top:1vh;
}
#btn-confirm:active { transform:scale(0.95); box-shadow:0 6px 20px rgba(233,69,96,0.3); }
#btn-confirm.show { display:flex; }

.running  { color:#0be881; }
.waiting  { color:#ffc048; }
.error    { color:#e94560; }
.offline  { color:#888; }
.idle     { color:#666; }
.charging { color:#00d2d3; }
.moving   { color:#a29bfe; }

.spinner {
  display:inline-block; width:clamp(20px,4vw,36px); height:clamp(20px,4vw,36px);
  border:4px solid rgba(255,255,255,0.2); border-top-color:#fff;
  border-radius:50%; animation:spin 0.8s linear infinite; margin-right:10px;
  vertical-align:middle;
}
@keyframes spin { to { transform:rotate(360deg); } }

.corner-btn {
  position:fixed; top:12px;
  width:clamp(44px,7vw,60px); height:clamp(44px,7vw,60px);
  font-size:clamp(1.2rem,3vw,1.8rem);
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  border-radius:50%; color:rgba(255,255,255,0.4);
  cursor:pointer; z-index:1002;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.2s, color 0.2s;
}
.corner-btn:active { background:rgba(255,255,255,0.2); color:#fff; }
#btn-home     { left:12px; }
#btn-settings { right:12px; }

#system-name {
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  font-size:clamp(1.1rem,2.8vw,1.6rem); font-weight:700;
  color:rgba(255,255,255,0.55); letter-spacing:0.02em;
  white-space:nowrap; max-width:60vw; overflow:hidden; text-overflow:ellipsis;
  z-index:1001; pointer-events:none;
}

.stuck-banner {
  display:none; position:fixed; top:0; left:0; right:0;
  background:linear-gradient(135deg,#e94560,#c23152); color:#fff;
  text-align:center; font-size:clamp(1.6rem,5vw,2.8rem); font-weight:800;
  padding:clamp(12px,3vh,28px) 20px; z-index:1000;
  animation:pulse 1.5s ease-in-out infinite;
}
.stuck-banner.show { display:block; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

#offline-banner {
  display:none; position:fixed; bottom:0; left:0; right:0;
  background:#333; color:#aaa;
  text-align:center; font-size:clamp(1rem,2.5vw,1.6rem);
  padding:10px; z-index:999;
}
#offline-banner.show { display:block; }
</style>
</head>
<body>

<button class="corner-btn" id="btn-home"     onclick="if(window.Android) Android.goHome()">⌂</button>
<button class="corner-btn" id="btn-settings" onclick="if(window.Android) Android.openSettings()">⚙</button>
<div id="system-name">UND RCS</div>

<div class="stuck-banner" id="stuckBanner">장애물 감지 — 작업중입니다. 비켜주세요!</div>
<div id="offline-banner">서버 재연결 중... <span id="retryCount"></span></div>

<div class="status-box">
  <div class="amr-label" id="amrLabel">-</div>
  <div class="poi-name" id="poiName">-</div>
  <div class="status-text" id="statusText">연결 중...</div>
  <div class="loop-info" id="loopInfo"></div>
  <button id="btn-confirm" onclick="doConfirm()">✔ 작업 확인</button>
</div>

<script>
var ROBOT_ID = window.ROBOT_ID || 0;
var SERVER_URL = window.SERVER_URL || 'http://192.168.10.5:8000';

var polling = null;
var stuckAudio = null;
var wasStuck = false;
var audioPlaying = false;
var autoConfirmTimer = null;
var retryCount = 0;
var isOnline = true;
const AUTO_CONFIRM_SEC = 5;
const RETRY_INTERVAL_MS = 1000;

const poiDisplayName = {
  'WORK2': '투입',
  'WORK4': '배출',
};

function getAudioUrl() { return SERVER_URL + '/static/audio/please_move.mp3'; }

function playStuckAudio() {
  if (audioPlaying) return;
  if (!stuckAudio) {
    stuckAudio = new Audio(getAudioUrl());
    stuckAudio.addEventListener('ended', () => { audioPlaying = false; });
    stuckAudio.addEventListener('error', () => { audioPlaying = false; });
  }
  audioPlaying = true;
  stuckAudio.currentTime = 0;
  stuckAudio.play().catch(() => { audioPlaying = false; });
}

function handleStuck(isStuck) {
  const banner = document.getElementById('stuckBanner');
  if (isStuck) {
    banner.classList.add('show');
    if (!wasStuck) playStuckAudio();
  } else {
    banner.classList.remove('show');
  }
  wasStuck = isStuck;
}

function setOffline(offline) {
  const banner = document.getElementById('offline-banner');
  if (offline) {
    retryCount++;
    banner.classList.add('show');
    document.getElementById('retryCount').textContent = '(' + retryCount + '번째 시도)';
  } else {
    retryCount = 0;
    banner.classList.remove('show');
  }
  isOnline = !offline;
}

async function fetchStatus() {
  try {
    const r = await fetch(SERVER_URL + '/api/tasks/loop/status/' + ROBOT_ID, { cache: 'no-store' });
    const d = await r.json();
    setOffline(false);
    render(d);
  } catch(e) {
    setOffline(true);
  }
}

function render(d) {
  handleStuck(!!d.stuck);

  // AMR 라벨 업데이트
  if (d.amr_label) {
    document.getElementById('amrLabel').textContent = d.amr_label;
  }

  const poi = d.current_poi || '';
  const btn = document.getElementById('btn-confirm');
  const poiEl = document.getElementById('poiName');
  const statusEl = document.getElementById('statusText');
  const loopEl = document.getElementById('loopInfo');
  const stopName = poiDisplayName[poi];

  statusEl.style.display = 'none';
  cancelAutoConfirm();
  btn.classList.remove('show');

  if (d.status === 'moving_to_start' || d.status === 'starting') {
    poiEl.textContent = '투입 장소로\n이동 중';
    poiEl.style.color = '#a29bfe';
    statusEl.style.display = '';
    statusEl.innerHTML = '<span class="moving"><span class="spinner"></span></span>';
  } else if (d.status === 'resuming') {
    poiEl.textContent = '작업 위치로\n이동 중';
    poiEl.style.color = '#a29bfe';
    statusEl.style.display = '';
    statusEl.innerHTML = '<span class="moving"><span class="spinner"></span></span>';
  } else if (d.status === 'running') {
    const msg = d.message || '';
    if (msg.includes('투입')) {
      poiEl.textContent = '투입 장소로\n이동 중';
    } else if (msg.includes('배출')) {
      poiEl.textContent = '배출 장소로\n이동 중';
    } else {
      poiEl.textContent = '이동 중';
    }
    poiEl.style.color = '#0be881';
    statusEl.style.display = '';
    statusEl.innerHTML = '<span class="running"><span class="spinner"></span></span>';
  } else if (d.status === 'waiting_confirmation') {
    const msg = d.message || '';
    if (msg.includes('투입')) {
      poiEl.textContent = '투입 장소\n대기';
    } else if (msg.includes('배출')) {
      poiEl.textContent = '배출 장소\n대기';
    } else {
      poiEl.textContent = stopName || poi;
    }
    poiEl.style.color = '#ffc048';
    btn.classList.add('show');
    startAutoConfirm();
  } else if (d.status === 'evacuating') {
    poiEl.textContent = '대피 장소로\n이동 중';
    poiEl.style.color = '#e94560';
    statusEl.style.display = '';
    statusEl.innerHTML = '<span class="error"><span class="spinner"></span></span>';
  } else if (d.status === 'returning' || d.status === 'finishing') {
    poiEl.textContent = '복귀 장소로\n이동 중';
    poiEl.style.color = '#a29bfe';
    statusEl.style.display = '';
    statusEl.innerHTML = '<span class="moving"><span class="spinner"></span></span>';
  } else if (d.status === 'charging_route' || d.status === 'low_battery_charging') {
    poiEl.textContent = '충전소로\n이동 중';
    poiEl.style.color = '#00d2d3';
    statusEl.style.display = '';
    statusEl.innerHTML = '<span class="charging"><span class="spinner"></span></span>';
  } else if (d.status === 'charging') {
    poiEl.textContent = '충전 중';
    poiEl.style.color = '#00d2d3';
  } else if (d.status === 'standby') {
    poiEl.textContent = '대기 중';
    poiEl.style.color = '#666';
  } else if (d.status === 'error') {
    poiEl.textContent = '오류 발생';
    poiEl.style.color = '#e94560';
    if (d.message) {
      statusEl.style.display = '';
      statusEl.innerHTML = '<span class="error">' + d.message + '</span>';
    }
  } else {
    poiEl.textContent = '대기 중';
    poiEl.style.color = '#666';
  }

  loopEl.textContent = d.loop ? ('반복 ' + d.loop + '회') : '';
}

function startAutoConfirm() {
  if (autoConfirmTimer) return;
  autoConfirmTimer = setTimeout(() => { autoConfirmTimer = null; doConfirm(); }, AUTO_CONFIRM_SEC * 1000);
}

function cancelAutoConfirm() {
  if (autoConfirmTimer) { clearTimeout(autoConfirmTimer); autoConfirmTimer = null; }
}

async function doConfirm() {
  cancelAutoConfirm();
  const btn = document.getElementById('btn-confirm');
  btn.disabled = true;
  btn.textContent = '전송 중...';
  try {
    const r = await fetch(SERVER_URL + '/api/tasks/loop/confirm/' + ROBOT_ID, { method: 'POST' });
    const d = await r.json();
    if (r.ok) {
      btn.textContent = '✔ 확인 완료';
      btn.style.background = 'linear-gradient(135deg,#0be881,#05c46b)';
      setTimeout(() => {
        cancelAutoConfirm(); btn.classList.remove('show');
        btn.disabled = false; btn.textContent = '✔ 작업 확인'; btn.style.background = '';
      }, 1500);
    } else {
      btn.textContent = d.detail || '오류';
      setTimeout(() => { btn.disabled = false; btn.textContent = '✔ 작업 확인'; }, 2000);
    }
  } catch(e) {
    btn.textContent = '전송 실패';
    setTimeout(() => { btn.disabled = false; btn.textContent = '✔ 작업 확인'; }, 2000);
  }
}

// 시스템 이름 (서버의 RCS 설정과 동기화) — 페이지 로드 + 60초마다 갱신
function fetchSystemName() {
  var el = document.getElementById('system-name');
  if (!el) return;
  fetch(SERVER_URL + '/api/settings/system-name')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (d && d.system_name) el.textContent = d.system_name;
    })
    .catch(function() { /* 오프라인 — 마지막 값 유지 */ });
}
var systemNamePolling = setInterval(fetchSystemName, 60000);
fetchSystemName();

function initApp() {
  ROBOT_ID = window.ROBOT_ID || ROBOT_ID;
  SERVER_URL = window.SERVER_URL || SERVER_URL;
  stuckAudio = null;
  if (polling) clearInterval(polling);
  fetchStatus();
  fetchSystemName();
  polling = setInterval(fetchStatus, RETRY_INTERVAL_MS);
}

if (ROBOT_ID !== 0) {
  fetchStatus();
  polling = setInterval(fetchStatus, RETRY_INTERVAL_MS);
}
</script>
</body>
</html>
