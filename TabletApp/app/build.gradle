plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.und.rcs.tablet'
    compileSdk 35

    defaultConfig {
        applicationId "com.und.rcs.tablet"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "mode"
    productFlavors {
        robot {
            dimension "mode"
            applicationIdSuffix ".robot"
            versionNameSuffix "-robot"
            resValue "string", "app_name", "RCS 로봇태블릿"
            buildConfigField "String", "APP_MODE", "\"robot\""
        }
        console {
            dimension "mode"
            applicationIdSuffix ".console"
            versionNameSuffix "-console"
            resValue "string", "app_name", "RCS 관리자콘솔"
            buildConfigField "String", "APP_MODE", "\"console\""
        }
        // 2026-08-24 추가 — 위치(POI)별 태블릿.
        //   현장은 R1·R2(호출) / J1·J2(확인) 네 곳에 각각 태블릿을 둔다.
        //   기존 console/robot 은 건드리지 않았다. 별도 applicationId 라 셋 다 동시 설치 가능.
        poi {
            dimension "mode"
            applicationIdSuffix ".poi"
            versionNameSuffix "-poi"
            resValue "string", "app_name", "RCS 위치태블릿"
            buildConfigField "String", "APP_MODE", "\"poi\""
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
