plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.und.rcs.tablet'
    compileSdk 35

    defaultConfig {
        applicationId "com.und.rcs.tablet"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "mode"
    productFlavors {
        robot {
            dimension "mode"
            applicationIdSuffix ".robot"
            versionNameSuffix "-robot"
            resValue "string", "app_name", "RCS 로봇태블릿"
            buildConfigField "String", "APP_MODE", "\"robot\""
        }
        console {
            dimension "mode"
            applicationIdSuffix ".console"
            versionNameSuffix "-console"
            resValue "string", "app_name", "RCS 관리자콘솔"
            buildConfigField "String", "APP_MODE", "\"console\""
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
